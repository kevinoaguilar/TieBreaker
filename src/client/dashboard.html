<!DOCTYPE html>
<html>

<head>
    <title>TieBreaker | Dashboard</title>
    <link rel="icon" type="image/png" href="images/tieBreaker.png">

    <script>
        // 1. THE GATEKEEPER: Check for token
        const token = localStorage.getItem('tiebreaker_token');
        if (!token) {
            alert("Please log in first!");
            window.location.href = 'index.html';
        }

        // 2. THE CREATOR: Asks server for a PIN, then redirects [UPDATED]
        async function createSession(type) {
            try {
                // --- FIX 1: Parse the user correctly ---
                let currentUser = "Host";
                const storedInfo = localStorage.getItem('user_info');
                if (storedInfo) {
                    try {
                        // Unpack the JSON to get just the name
                        const parsed = JSON.parse(storedInfo);
                        currentUser = parsed.username || "Host";
                    } catch (e) {
                        currentUser = storedInfo; // Fallback if it was just a string
                    }
                }

                // --- FIX 2: Send the 'type' (food/movies) to the server ---
                const response = await fetch('http://localhost:3000/api/session/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        username: currentUser,
                        category: type // 'food', 'movies', or 'activities'
                    }) 
                });
                
                const data = await response.json();

                if (data.success) {
                    window.location.href = `host${type}.html?code=${data.pin}`;
                } else {
                    alert("Server Error: " + data.error);
                }

            } catch (error) {
                console.error(error);
                alert("Could not connect to server.");
            }
        }

        // 3. THE JOINER: Sends the room code [UPDATED]
        function joinSession() {
            const codeInput = document.getElementById('groupCode');
            const code = codeInput.value.trim();

            // Updated to allow 4 digits (since your backend generates 4 digits)
            if (code.length >= 4) {
                window.location.href = `joinsession.html?code=${code}`;
            } else {
                alert('Please enter a valid room code (4 digits).');
            }
        }

        // 4. THE LOGOUT
        function handleLogout() {
            localStorage.removeItem('tiebreaker_token');
            localStorage.removeItem('user_info');
            alert("Logging you out...");
            window.location.href = 'index.html';
        }
    </script>
</head>

<body bgcolor="#8ac1f1">
    <font face="Arial">

        <div style="background-color: white; padding: 15px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1);">
            <table width="100%">
                <tr>
                    <td><b style="font-size: 20px;">TieBreaker</b></td>
                    <td align="right">
                        <a href="dashboard.html"
                            style="text-decoration: none; color: black; font-weight: bold;">Dashboard</a> |
                        <a href="#" onclick="handleLogout()"
                            style="text-decoration: none; color: red; font-weight: bold;">Logout</a>
                    </td>
                </tr>
            </table>
        </div>

        <center>
            <h1 style="color: white; font-size: 40px; margin-top: 50px;">Ready to Decide?</h1>
            <p style="color: white; font-size: 20px;">Choose a category to start a new session</p>

            <br>

            <div style="background-color: white; width: 250px; padding: 30px; border-radius: 20px; display: inline-block; margin: 10px; box-shadow: 0px 10px 30px rgba(0,0,0,0.2);">
                <p style="font-size: 50px; margin: 0;">🍕</p>
                <h2>Food</h2>
                <p>Decide where to eat</p>
                <button onclick="createSession('food')"
                    style="background-color: red; color: white; padding: 15px; width: 100%; border: none; border-radius: 10px; font-weight: bold; cursor: pointer;">
                    Start Food Session
                </button>
            </div>

            <div style="background-color: white; width: 250px; padding: 30px; border-radius: 20px; display: inline-block; margin: 10px; box-shadow: 0px 10px 30px rgba(0,0,0,0.2);">
                <p style="font-size: 50px; margin: 0;">🎬</p>
                <h2>Movies</h2>
                <p>Pick what to watch</p>
                <button onclick="createSession('movies')"
                    style="background-color: red; color: white; padding: 15px; width: 100%; border: none; border-radius: 10px; font-weight: bold; cursor: pointer;">
                    Start Movie Session
                </button>
            </div>

            <div style="background-color: white; width: 250px; padding: 30px; border-radius: 20px; display: inline-block; margin: 10px; box-shadow: 0px 10px 30px rgba(0,0,0,0.2);">
                <p style="font-size: 50px; margin: 0;">🎉</p>
                <h2>Activities</h2>
                <p>Find something fun to do</p>
                <button onclick="createSession('activities')"
                    style="background-color: red; color: white; padding: 15px; width: 100%; border: none; border-radius: 10px; font-weight: bold; cursor: pointer;">
                    Start Activity Session
                </button>
            </div>

            <br><br><br>

            <div style="background-color: white; width: 400px; padding: 35px; border-radius: 20px; box-shadow: 0px 10px 30px rgba(0,0,0,0.2);">
                <h2 style="margin-top: 0;">Join Existing Room</h2>
                <p>Enter the 4-digit code shared by your host</p>
                <input type="text" id="groupCode" placeholder="4821" maxlength="6"
                    style="padding: 12px; font-size: 20px; text-align: center; border: 1px solid #ccc; border-radius: 5px; width: 80%;">
                <br><br>
                <button onclick="joinSession()"
                    style="background-color: green; color: white; padding: 15px; width: 100%; border: none; border-radius: 10px; font-weight: bold; font-size: 18px; cursor: pointer;">
                    Join Session
                </button>
            </div>
        </center>
    </font>
</body>
</html>
