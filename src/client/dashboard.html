<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TieBreaker | Dashboard</title>
    <link rel="icon" type="image/png" href="images/tieBreaker.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Category card grid */
        .category-grid {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 30px 0;
        }

        .category-card {
            background: white;
            width: 220px;
            padding: 30px 20px;
            border-radius: var(--radius);
            text-align: center;
            box-shadow: var(--shadow);
        }


        .category-card h3 {
            margin: 0 0 8px 0;
            color: var(--text-main);
        }
        
    </style>
    <script>
        // Redirect to login if not logged in
        const token = localStorage.getItem('tiebreaker_token');
        if (!token) {
            alert("Please log in first!");
            window.location.href = 'index.html';
        }
    </script>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar">
        <span class="navbar-brand">TieBreaker</span>
        <div style="display: flex; align-items: center; gap: 15px;">
            <span id="navUsername" style="color: var(--text-main); font-size: 14px; font-weight: 600;"></span>
            <a href="#" class="danger" onclick="handleLogout()">Logout</a>
        </div>
    </nav>

    <div style="text-align:center; padding: 40px 20px;">

        <h1 style="color: rgb(0, 0, 0); font-size: 36px; margin-bottom: 10px;">Ready to Decide?</h1>
        <p style="color: rgb(0, 0, 0); font-size: 18px; margin-bottom: 0;">Choose a category to start a new session</p>

        <!-- Category Cards -->
        <div class="category-grid">
            <div class="category-card">
                <h3>Food</h3>
                <p class="desc">Decide where to eat</p>
                <button class="btn btn-red" onclick="createSession('food')">Start Food Session</button>
            </div>
            <div class="category-card">
                <h3>Movies</h3>
                <p class="desc">Pick what to watch</p>
                <button class="btn btn-red" onclick="createSession('movies')">Start Movie Session</button>
            </div>
            <div class="category-card">
                <h3>Activities</h3>
                <p class="desc">Find something fun to do</p>
                <button class="btn btn-red" onclick="createSession('activities')">Start Activity Session</button>
            </div>
        </div>

        <!-- Join Session -->
        <div class="card" style="max-width: 420px; margin: 0 auto; text-align: left;">
            <h2 style="margin-top: 0; text-align: center;">Join Existing Room</h2>
            <p style="color: var(--text-muted); text-align: center; margin-bottom: 20px;">Enter the 4-digit code shared
                by your host</p>
            <input type="text" id="groupCode" placeholder="e.g. 4821" maxlength="6" class="form-input"
                style="text-align: center; font-size: 24px; margin-bottom: 15px;">
            <button class="btn btn-green" onclick="joinSession()">Join Session</button>
        </div>
    </div>

    <script>
        // Set username in navbar
        try {
            const u = JSON.parse(localStorage.getItem('user_info')).username;
            if (u) document.getElementById('navUsername').textContent = 'Welcome ' + u + '!';
        } catch (e) { }

        // Creates a new session and redirects to the (unified) host page
        async function createSession(type) {
            try {
                // Get username from localStorage
                let currentUser = "Host";
                const storedInfo = localStorage.getItem('user_info');
                if (storedInfo) {
                    try {
                        const parsed = JSON.parse(storedInfo);
                        currentUser = parsed.username || "Host";
                    } catch (e) {
                        currentUser = storedInfo;
                    }
                }

                const response = await fetch('http://localhost:3000/api/session/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: currentUser, category: type })
                });
                const data = await response.json();

                if (data.success) {
                    window.location.href = `host${type}.html?code=${data.pin}`;
                } else {
                    alert("Server Error: " + data.error);
                }
            } catch (error) {
                console.error(error);
                alert("Could not connect to server.");
            }
        }

        // Sends user to the join page with the entered code
        function joinSession() {
            const code = document.getElementById('groupCode').value.trim();
            if (code.length >= 4) {
                window.location.href = `joinSession.html?code=${code}`;
            } else {
                alert('Please enter a valid room code (4 digits).');
            }
        }

        // Clears login info and sends back to home
        function handleLogout() {
            localStorage.removeItem('tiebreaker_token');
            localStorage.removeItem('user_info');
            alert("Logging you out...");
            window.location.href = 'index.html';
        }
    </script>
</body>

</html>
