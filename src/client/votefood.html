<!DOCTYPE html>
<html>

<head>
    <title>Vote for Food - TieBreaker</title>
    <link rel="icon" type="image/png" href="images/tieBreaker.png">
</head>

<body bgcolor="#8ac1f1">
<font face="Arial">

    <!-- TOP NAV BAR -->
    <div style="background-color: white; padding: 15px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1);">
        <table width="100%">
            <tr>
                <td><b style="font-size: 20px;">TieBreaker</b></td>
                <td align="right">
                    <a href="dashboard.html" style="color: red; font-weight: bold;">Leave Session</a>
                </td>
            </tr>
        </table>
    </div>

    <br><br>

    <center>

        <div id="loadingMessage">
            <p style="font-size: 18px; color: white;">Finding restaurants near you... please wait</p>
        </div>

        <div id="errorMessage" style="display: none;">
            <p style="font-size: 18px; color: red;">Something went wrong loading restaurants. Is your server running?</p>
        </div>

        <!-- Voting Card -->
        <div id="votingCard" style="display: none; background-color: white; width: 450px; padding: 30px; border-radius: 20px; box-shadow: 0px 10px 30px rgba(0,0,0,0.2);">

            <p id="progressMsg" style="color: gray; font-size: 14px; margin-top: 0;">Restaurant 1 of 10</p>

            <img id="cardImg" src="" alt="Restaurant photo"
                style="width: 100%; height: 220px; object-fit: cover; border-radius: 12px; margin-bottom: 15px;">

            <h2 id="cardName" style="margin: 0 0 10px 0; color: #333;"></h2>

            <p style="color: #666; font-size: 14px; margin: 0 0 5px 0;">
                <b>Cuisine:</b> <span id="cardCuisine"></span> &nbsp;|&nbsp;
                <b>Price:</b> <span id="cardPrice"></span> &nbsp;|&nbsp;
                <b>Distance:</b> <span id="cardDistance"></span>
            </p>
            <p style="color: #666; font-size: 14px; margin: 0 0 15px 0;">
                <b>Rating:</b> <span id="cardRating"></span>
            </p>

            <a id="cardLink" href="#" target="_blank" style="color: #8ac1f1; font-weight: bold; font-size: 14px;">
                🔗 View on Yelp
            </a>

            <br><br>

            <table width="100%" cellspacing="10">
                <tr>
                    <td width="50%">
                        <button onclick="vote('no')"
                            style="background-color: red; color: white; padding: 15px; width: 100%; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer;">
                            ✖ No
                        </button>
                    </td>
                    <td width="50%">
                        <button onclick="vote('yes')"
                            style="background-color: green; color: white; padding: 15px; width: 100%; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer;">
                            ✔ Yes
                        </button>
                    </td>
                </tr>
            </table>
        </div>

        <!-- Done Screen -->
        <div id="doneCard" style="display: none; background-color: white; width: 450px; padding: 40px; border-radius: 20px; box-shadow: 0px 10px 30px rgba(0,0,0,0.2);">
            <h1 style="color: #333;">All Done! 🎉</h1>
            <p style="color: #666;">Waiting for the rest of your group...</p>
            <br>
            <b>Your Picks:</b>
            <div id="picksList" style="margin-top: 10px;"></div>
            <br>
            <button onclick="location.href='dashboard.html'"
                style="background-color: #333; color: white; padding: 15px; width: 100%; border: none; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer;">
                Back to Dashboard
            </button>
        </div>

    </center>

</font>

<script>

    // Read the PIN and location from storage
    var urlParams  = new URLSearchParams(window.location.search);
    var sessionPin = urlParams.get('code');
    var userLat    = localStorage.getItem('userLat');
    var userLng    = localStorage.getItem('userLng');

    console.log("Session PIN:", sessionPin);
    console.log("User location:", userLat, userLng);

    var restaurants  = [];
    var currentIndex = 0;
    var yesVotes     = [];


    async function fetchRestaurants() {

        // Check PIN
        if (!sessionPin) {
            console.error("No session PIN in URL!");
            showError("No session code found. Go back to the dashboard.");
            return;
        }

        // Check location — must be saved from index.html
        if (!userLat || !userLng) {
            console.error("No location found in localStorage!");
            showError("Location not found. Please go back to the login page and allow location access.");
            return;
        }

        try {
            // Pass lat/lng as query parameters to our backend
            var url = 'http://localhost:3000/api/session/' + sessionPin + '/food'
                    + '?lat=' + userLat
                    + '&lng=' + userLng;

            console.log("Fetching from:", url);

            var response = await fetch(url);
            console.log("Server response status:", response.status);

            var data = await response.json();
            console.log("Data received:", data);

            // Yelp returns data.businesses as the array of restaurants
            var results = (data.businesses || []).slice(0, 10);

            if (results.length === 0) {
                showError("No restaurants found near you.");
                return;
            }

            // Map Yelp fields to our card format
            restaurants = results.map(function(r) {

                // Yelp returns cuisine as an array like [{alias: "italian", title: "Italian"}]
                var cuisine = r.categories
                    .map(function(c) { return c.title; })
                    .slice(0, 2)
                    .join(" / ");

                // Yelp returns distance in meters — convert to miles
                var miles = (r.distance / 1609.34).toFixed(1) + " mi";

                return {
                    name:     r.name,
                    cuisine:  cuisine || "Restaurant",
                    price:    r.price || "N/A",
                    distance: miles,
                    rating:   r.rating + " ⭐ (" + r.review_count + " reviews)",
                    link:     r.url,
                    image_url: r.image_url || ""
                };
            });

            document.getElementById('loadingMessage').style.display = 'none';
            document.getElementById('votingCard').style.display     = 'block';
            loadCard(0);

        } catch (error) {
            console.error("Fetch error:", error);
            showError("Something went wrong loading restaurants. Is your server running?");
        }
    }


    function loadCard(i) {
        var r = restaurants[i];
        document.getElementById('cardImg').src              = r.image_url;
        document.getElementById('cardName').textContent     = r.name;
        document.getElementById('cardCuisine').textContent  = r.cuisine;
        document.getElementById('cardPrice').textContent    = r.price;
        document.getElementById('cardDistance').textContent = r.distance;
        document.getElementById('cardRating').textContent   = r.rating;
        document.getElementById('cardLink').href            = r.link;
        document.getElementById('progressMsg').textContent  = "Restaurant " + (i + 1) + " of " + restaurants.length;
    }


    function vote(choice) {
        if (choice === 'yes') {
            yesVotes.push(restaurants[currentIndex]);
        }

        currentIndex++;

        if (currentIndex < restaurants.length) {
            loadCard(currentIndex);
        } else {
            document.getElementById('votingCard').style.display = 'none';

            var picksList = document.getElementById('picksList');

            if (yesVotes.length === 0) {
                picksList.innerHTML = '<p style="color: gray;">You said no to everything!</p>';
            } else {
                yesVotes.forEach(function(r) {
                    picksList.innerHTML += '<p>✔ <b>' + r.name + '</b> — ' + r.cuisine + ' ' + r.price + '</p>';
                });
            }

            document.getElementById('doneCard').style.display = 'block';
        }
    }


    function showError(msg) {
        document.getElementById('loadingMessage').style.display = 'none';
        document.getElementById('errorMessage').innerHTML = '<p style="font-size: 18px; color: red;">' + msg + '</p>';
        document.getElementById('errorMessage').style.display = 'block';
    }


    fetchRestaurants();

</script>

</body>
</html>
