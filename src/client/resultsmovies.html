<!DOCTYPE html>
<html>

<head>
    <title>Results - TieBreaker</title>
    <link rel="icon" type="image/png" href="images/tieBreaker.png">
</head>

<body bgcolor="#8ac1f1">
<font face="Arial">

    <div style="background-color: white; padding: 15px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1);">
        <table width="100%">
            <tr>
                <td><b style="font-size: 20px;">TieBreaker</b></td>
                <td align="right">
                    <a href="dashboard.html" style="color: red; font-weight: bold;">Leave Session</a>
                </td>
            </tr>
        </table>
    </div>

    <br><br>

    <center>

        <div style="background-color: white; width: 500px; padding: 40px; border-radius: 20px; box-shadow: 0px 10px 30px rgba(0,0,0,0.2);">

            <h1 style="color: #333; margin-top: 0;">🎉 It's a Match!</h1>
            <p style="color: #666;">Your group agreed on:</p>

            <div id="matchList"></div>

            <br>

            <button onclick="location.href='dashboard.html'"
                style="background-color: #333; color: white; padding: 15px; width: 100%; border: none; border-radius: 10px; font-weight: bold; font-size: 16px; cursor: pointer;">
                Back to Dashboard
            </button>

        </div>

    </center>

</font>

<script>

    // Read matches from localStorage — set by votemovies.html when match_found fires
    var matches = JSON.parse(localStorage.getItem('matches') || '[]');
    var list    = document.getElementById('matchList');

    if (matches.length === 0) {
        list.innerHTML = '<p style="color: gray;">No matches found.</p>';
    } else {
        matches.forEach(function(movieName) {
            list.innerHTML += `
                <div style="background-color: #f1f5f9; padding: 20px; border-radius: 12px; margin: 10px 0; font-size: 18px; font-weight: bold; color: #333;">
                    🎬 ${movieName}
                </div>
            `;
        });
    }

    // Clear matches from localStorage after reading
    localStorage.removeItem('matches');

</script>

</body>
</html>
